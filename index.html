function loadState(){
  const saved = localStorage.getItem("bookingSystemStateV1");
  if(saved){
    const parsed = JSON.parse(saved);
    parsed.settings = { ...structuredClone(defaultState).settings, ...(parsed.settings || {}) };
    if(!parsed.roomInventory) parsed.roomInventory = structuredClone(defaultState).roomInventory;
    return parsed;
  }
  return structuredClone(defaultState);
}
function saveState(){

function nights(a,b){ return Math.max(1, Math.round((new Date(b)-new Date(a))/(1000*60*60*24)) || 1); }

async function sendTelegramBooking(booking){
  const message = [
    "🏨 มีการจองใหม่",

    "เบอร์: " + booking.phone,

    "ยอดรวม: " + baht(booking.total),

  ].join("\n");

  const token = state.settings.telegramBotToken || TELEGRAM_BOT_TOKEN;
  const chatId = state.settings.telegramChatId || TELEGRAM_CHAT_ID;

  if(!token || !chatId){
    console.log("Telegram demo mode:", message);
    return { success:true, demo:true };
  }

  try{
    const url = "https://api.telegram.org/bot" + token + "/sendMessage";
    const res = await fetch(url,{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body:JSON.stringify({
        chat_id: chatId,
        text: message
      })
    });
    return await res.json();
  }catch(err){
    console.warn("Telegram send failed", err);
    return { success:false, error:String(err) };
  }
}

function dateOnly(d){
  return new Date(d.getFullYear(), d.getMonth(), d.getDate());
}

function shouldSendReminder(booking, today = new Date()){
  if(!state.settings.reminderEnabled) return false;
  if(!booking || !booking.checkIn) return false;
  if(booking.status === "Cancelled" || booking.status === "Check-out") return false;

  const checkInDate = dateOnly(new Date(booking.checkIn));
  const todayDate = dateOnly(today);
  const diffDays = Math.round((checkInDate - todayDate) / (1000*60*60*24));
  const targetDays = Number(state.settings.reminderDaysBefore || 1);
  const reminderKey = "reminder_" + targetDays + "d";

  if(diffDays !== targetDays) return false;
  if(booking[reminderKey]) return false;

  return true;
}

  let sent = 0;

  for(const booking of state.bookings){
    if(shouldSendReminder(booking)){
      const result = await sendLineFlexReminder(booking);
      if(result && (result.success || result.demo)){
        booking[reminderKey] = todayKey;
        sent++;
      }
    }
  }

  if(sent > 0){
    state.settings.reminderLastRunDate = todayKey;
    saveState();
    log("Auto Reminder", "ส่งแจ้งเตือนก่อนเข้าพัก " + sent + " รายการ");
  }
  return sent;
}


async function sendLineUserIdToWebhook(userId, source="manual"){
  const webhook = state.settings.lineWebhookUrl || "";
  if(!webhook || !userId){
    console.log("LINE userId webhook demo mode:", { webhook: !!webhook, userId: userId || "-", source });
    return { success:true, demo:true };
  }
  try{
    const res = await fetch(webhook,{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body:JSON.stringify({
        action:"saveLineUserId",
        userId,
        source,
        time:new Date().toISOString()
      })
    });
    const text = await res.text();
    return { success:res.ok, status:res.status, body:text };
  }catch(err){
    console.warn("LINE userId webhook error", err);
    return { success:false, error:String(err) };
  }
}

function findAvailableRoom(type, checkIn, checkOut){
  const rooms = state.roomInventory[type] || [];
  for(const roomId of rooms){
    const conflict = state.bookings.some(b =>
      b.roomId === roomId &&
      !(checkOut <= b.checkIn || checkIn >= b.checkOut)
    );
    if(!conflict) return roomId;
  }
  return null;
}

function submitBooking(){
  const room = bookingModalRoom;
  const addOnTotal = (bookingForm.addOns||[]).reduce((sum,id)=>{
    const a=state.addOns.find(x=>x.id===id); return sum + Number(a?.price||0);
  },0);
  const total = Number(room.price) * nights(bookingForm.checkIn, bookingForm.checkOut) + addOnTotal;
  const roomId = findAvailableRoom(room.type, bookingForm.checkIn, bookingForm.checkOut);
  if(!roomId){
    alert("❌ ห้องเต็มแล้วช่วงนี้");
    return;
  }

  const booking = {
    id:"BK"+Date.now().toString().slice(-8),
    guest:bookingForm.guest||"",
    phone:bookingForm.phone||"",
    email:bookingForm.email||"",
    lineId:bookingForm.lineId||"",
    lineUserId:bookingForm.lineUserId || state.settings.lineDefaultUserId || "",
    room:room.name,
    roomId:roomId,
    checkIn:bookingForm.checkIn,
    checkOut:bookingForm.checkOut,
    adults:bookingForm.adults||1,
    children:bookingForm.children||0,
    total,
    status:"Pending",
    slip:!!bookingForm.slip,
    channel:"Website",
    note:bookingForm.note||""
  };

  state.bookings.unshift(booking);
  state.lastSuccess = booking;
  saveState();

  api("createBooking", booking);
  sendTelegramBooking(booking).then(result => {
    console.log("Telegram result:", result);
  });
  if(state.settings.lineFlexEnabled){
    sendLineFlexBooking(booking).then(result => {
      console.log("LINE Flex result:", result);
    });
  }

  log("Create Booking", booking.id + " · " + booking.guest);
  bookingModalRoom = null;
  view = "success";
  render();
}

  const result = await sendTelegramBooking(testBooking);

  }else{
    alert("ส่ง Telegram ไม่สำเร็จ กรุณาตรวจสอบ Token / Chat ID");
  }
}

async function saveLineUserIdManual(){

}

}
function renderLogsAdmin(){
