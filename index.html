function todayISO(){
  const d = new Date();
  d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0,10);
}
function addDaysISO(iso, days){
  const d = new Date((iso || todayISO()) + "T00:00:00");
  d.setDate(d.getDate() + Number(days || 0));
  return d.toISOString().slice(0,10);
}
function isDateBefore(a,b){ return String(a || "") < String(b || ""); }
function normalizeDateRange(obj){
  const today = todayISO();
  if(!obj.checkIn || isDateBefore(obj.checkIn, today)) obj.checkIn = today;

  if(!obj.checkOut || String(obj.checkOut) <= String(obj.checkIn)) obj.checkOut = minOut;
  return obj;

  const today = todayISO();
  if(!checkIn || !checkOut){ if(!silent) alert("กรุณาเลือกวันเข้าพักและวันออก"); return false; }
  if(isDateBefore(checkIn, today)){ if(!silent) alert("ไม่สามารถเลือกวันย้อนหลังได้"); return false; }
  if(String(checkOut) <= String(checkIn)){ if(!silent) alert("วันออกต้องมากกว่าวันเข้าพักอย่างน้อย 1 วัน"); return false; }
  return true;

const CHECKIN_TIME_MIN = "12:00";
const CHECKIN_TIME_MAX = "23:00";
const CHECKOUT_TIME_MIN = "08:00";
const CHECKOUT_TIME_MAX = "12:00";
const DEFAULT_CHECKIN_TIME = "13:00";
const DEFAULT_CHECKOUT_TIME = "12:00";
function normalizeTimeValue(value, fallback){
  const v = String(value || "").slice(0,5);
  return /^\d{2}:\d{2}$/.test(v) ? v : fallback;
}
function normalizeBookingTimes(obj){
  obj.checkInTime = normalizeTimeValue(obj.checkInTime, DEFAULT_CHECKIN_TIME);
  obj.checkOutTime = normalizeTimeValue(obj.checkOutTime, DEFAULT_CHECKOUT_TIME);
  if(obj.checkInTime < CHECKIN_TIME_MIN) obj.checkInTime = CHECKIN_TIME_MIN;
  if(obj.checkInTime > CHECKIN_TIME_MAX) obj.checkInTime = CHECKIN_TIME_MAX;
  if(obj.checkOutTime < CHECKOUT_TIME_MIN) obj.checkOutTime = CHECKOUT_TIME_MIN;
  if(obj.checkOutTime > CHECKOUT_TIME_MAX) obj.checkOutTime = CHECKOUT_TIME_MAX;
  return obj;
}
function validateBookingTimes(checkInTime, checkOutTime, silent=false){
  const ci = normalizeTimeValue(checkInTime, "");
  const co = normalizeTimeValue(checkOutTime, "");
  if(!ci || ci < CHECKIN_TIME_MIN || ci > CHECKIN_TIME_MAX){ if(!silent) alert("เวลาเช็คอินต้องอยู่ระหว่าง 12:00 - 23:00"); return false; }
  if(!co || co < CHECKOUT_TIME_MIN || co > CHECKOUT_TIME_MAX){ if(!silent) alert("เวลาเช็คเอาท์ต้องอยู่ระหว่าง 08:00 - 12:00"); return false; }
  return true;
}
function validateBookingDateTime(checkIn, checkOut, checkInTime, checkOutTime, silent=false){

  }

function dateOnly(d){
  return new Date(d.getFullYear(), d.getMonth(), d.getDate());
}

function shouldSendReminder(booking, today = new Date()){
  if(!state.settings.reminderEnabled) return false;
  if(!booking || !booking.checkIn) return false;
  if(booking.status === "Cancelled" || booking.status === "Check-out") return false;

  const checkInDate = dateOnly(new Date(booking.checkIn));
  const todayDate = dateOnly(today);
  const diffDays = Math.round((checkInDate - todayDate) / (1000*60*60*24));
  const targetDays = Number(state.settings.reminderDaysBefore || 1);
  const reminderKey = "reminder_" + targetDays + "d";

  if(diffDays !== targetDays) return false;
  if(booking[reminderKey]) return false;

  return true;
}

async function runAutoReminders(){
  if(!state.settings.reminderEnabled) return;
  const targetDays = Number(state.settings.reminderDaysBefore || 1);
  const reminderKey = "reminder_" + targetDays + "d";
  const todayKey = new Date().toISOString().slice(0,10);
  let sent = 0;

  for(const booking of state.bookings){
    if(shouldSendReminder(booking)){
      const result = await sendLineFlexReminder(booking);
      if(result && result.success){
        booking[reminderKey] = todayKey;
        sent++;
      }
    }
  }

  if(sent > 0){
    state.settings.reminderLastRunDate = todayKey;
    saveState();
    log("Auto Reminder", "ส่งแจ้งเตือนก่อนเข้าพัก " + sent + " รายการ");
  }
  return sent;
}

function findAvailableRoom(type, checkIn, checkOut){
  const rooms = state.roomInventory[type] || [];
  for(const roomId of rooms){
    const conflict = state.bookings.some(b =>
      b.roomId === roomId &&
      !(checkOut <= b.checkIn || checkIn >= b.checkOut)
    );
    if(!conflict) return roomId;
  }
  return null;
}

    const fn = el.getAttribute("data-click");
    el.onclick = window[fn];
  });
}

function openBooking(roomId){
  normalizeDateRange(customerSearch);
  bookingModalRoom = state.rooms.find(r=>r.id===roomId);
  bookingStep = 1;
  bookingForm = normalizeBookingTimes(normalizeDateRange({ checkIn:customerSearch.checkIn, checkOut:customerSearch.checkOut, checkInTime:policyCheckInTime(), checkOutTime:policyCheckOutTime(), adults:Number(customerSearch.adults||1), children:Number(customerSearch.children||0), addOns:[], slip:false, accept:false }));
  render();
}
function closeBooking(){ bookingModalRoom=null; render(); }
function updateBookingField(k,v){
  bookingForm[k]=v;
  if(k === "checkIn" || k === "checkOut") { normalizeDateRange(bookingForm); render(); }
  if(k === "checkInTime" || k === "checkOutTime") { bookingForm.checkInTime = policyCheckInTime(); bookingForm.checkOutTime = policyCheckOutTime(); render(); }
}
function goBookingStep2(){
  if(!validateBookingDateTime(bookingForm.checkIn, bookingForm.checkOut, bookingForm.checkInTime, bookingForm.checkOutTime)) return;
  bookingStep = 2;
  render();
}
function toggleBookingAddOn(id){
  bookingForm.addOns = bookingForm.addOns || [];
  bookingForm.addOns = bookingForm.addOns.includes(id) ? bookingForm.addOns.filter(x=>x!==id) : [...bookingForm.addOns,id];
  render();
}
async function submitBooking(){
  if(!isApiReady()){
    alert("ยังไม่ได้ตั้งค่า API_URL ของ Google Apps Script");
    return;
  }
  if(!validateBookingDateTime(bookingForm.checkIn, bookingForm.checkOut, bookingForm.checkInTime, bookingForm.checkOutTime)) return;
  if(!bookingForm.accept){ alert("กรุณายอมรับเงื่อนไขการจอง"); return; }
  if(!bookingForm.slipBase64){ alert("กรุณาแนบสลิปโอนเงินก่อนยืนยันการจอง"); return; }
  const room = bookingModalRoom;
  const addOnTotal = (bookingForm.addOns||[]).reduce((sum,id)=>{
    const a=state.addOns.find(x=>x.id===id); return sum + Number(a?.price||0);
  },0);
  const total = Number(room.price) * nights(bookingForm.checkIn, bookingForm.checkOut) + addOnTotal;

  const booking = {
    guest:bookingForm.guest||"",
    phone:bookingForm.phone||"",
    email:bookingForm.email||"",
    lineId:bookingForm.lineId||"",
    lineUserId:bookingForm.lineUserId || "",
    roomId:room.id,
    roomType:room.type,
    room:room.name,
    checkIn:bookingForm.checkIn,
    checkOut:bookingForm.checkOut,
    checkInTime:policyCheckInTime(),
    checkOutTime:policyCheckOutTime(),
    adults:Number(bookingForm.adults||1),
    children:Number(bookingForm.children||0),
    addOns:bookingForm.addOns||[],
    total,
    status:"Pending",
    slip:true,
    slipFileName:bookingForm.slipFileName || "slip.jpg",
    slipMimeType:bookingForm.slipMimeType || "image/jpeg",
    slipBase64:bookingForm.slipBase64 || "",
    channel:"Website",
    note:bookingForm.note||""
  };

  const result = await api("createBooking", booking);
  if(!result || result.success === false){
    alert((result && result.message) || "บันทึกการจองไม่สำเร็จ");
    return;
  }

  const savedBooking = result.booking || (result.data && result.data.booking) || { ...booking, id: result.bookingId || ("BK"+Date.now().toString().slice(-8)) };
  state.bookings.unshift(savedBooking);
  state.lastSuccess = savedBooking;
  saveState();
  log("Create Booking", savedBooking.id + " · " + savedBooking.guest);
  bookingModalRoom = null;
  view = "success";
  render();
}

async function saveAdminUser(){
  const id=editingAdminId==="new" ? "U"+Date.now() : editingAdminId;
  const data={id,username:document.getElementById("adUsername").value,password:document.getElementById("adPassword").value,name:document.getElementById("adName").value,email:document.getElementById("adEmail").value,role:document.getElementById("adRole").value,active:document.getElementById("adActive").checked};
  if(!data.username || !data.password || !data.name) return alert("กรอก Username / Password / ชื่อ ให้ครบ");
  if(isApiReady()){
    const result = await api('saveAdminUser', data);
    if(!result || result.success === false) return alert((result && result.message) || 'บันทึกผู้ใช้งานลง Sheet ไม่สำเร็จ');
  }

function openCloudinaryWidget(callback, options={}){
  const cloudName = state.settings.cloudinaryCloudName || CLOUDINARY_CONFIG.cloudName;
  const uploadPreset = state.settings.cloudinaryUploadPreset || CLOUDINARY_CONFIG.uploadPreset;
  if(!cloudName || !uploadPreset){ callback({success:false,error:"ยังไม่ได้ตั้งค่า Cloud Name / ชื่อ Cloud / Upload Preset"}); return; }
  if(!window.cloudinary){ callback({success:false,error:"Cloudinary widget โหลดไม่สำเร็จ"}); return; }
  const widget = cloudinary.createUploadWidget({
    cloudName,
    uploadPreset,
    sources:["local","camera"],
    multiple: options.multiple === true,
    maxFiles: options.maxFiles || 20,
    resourceType:"image",
    clientAllowedFormats:["jpg","jpeg","png","webp"],
    maxFileSize: 10000000
  }, (error, result) => {
    if(error){ callback({success:false,error:String(error.message || error)}); }
    if(result && result.event === "success") callback({success:true,url:result.info.secure_url, info:result.info});
  });
  widget.open();
}

    lineUserId: row.LINE_userId || row.lineUserId || "",
    room: row["ประเภทห้อง"] || row.room || "",
    roomId: row.RoomID || row.roomId || "",
    checkIn: toIsoDate(row["Check-in"] || row.checkIn || ""),
    checkOut: toIsoDate(row["Check-out"] || row.checkOut || ""),
    nights: Number(row["คืน"] || row.nights || 1),
    adults: Number(row["ผู้ใหญ่"] || row.adults || 1),
    children: Number(row["เด็ก"] || row.children || 0),
    addOns: row["บริการเสริม"] || row.addOns || "",
    total: Number(row["ยอดเงิน"] || row.total || 0),
    payment: row.Payment || row.payment || "",
    status: row["สถานะ"] || row.status || "Pending",
    slipUrl: row.SlipURL || row.slipUrl || "",
    note: row["หมายเหตุ"] || row.note || "",
    channel: row.Channel || row.channel || "Website",
    updatedAt: row.UpdatedAt || row.updatedAt || ""
  };
}

function toIsoDate(v){
  if(!v) return "";
  if(typeof v === "string"){
    if(/^\d{4}-\d{2}-\d{2}/.test(v)) return v.slice(0,10);
    const d = new Date(v);
    return isNaN(d) ? v : d.toISOString().slice(0,10);
  }
  const d = new Date(v);
  return isNaN(d) ? "" : d.toISOString().slice(0,10);
}

function groupCount(rows, key){
  return rows.reduce((acc,b)=>{
    const k = b[key] || "ไม่ระบุ";
    acc[k] = (acc[k] || 0) + 1;
    return acc;
  }, {});
}

function groupSum(rows, key, valueKey){
  return rows.filter(b=>b.status!=="Cancelled").reduce((acc,b)=>{
    const k = b[key] || "ไม่ระบุ";
    acc[k] = (acc[k] || 0) + Number(b[valueKey] || 0);
    return acc;
  }, {});
}

function getMonthlyRevenue(rows){
  const out = {};
  rows.filter(b=>b.status!=="Cancelled").forEach(b=>{
    const d = b.checkIn || b.createdAt || "";
    const month = String(d).slice(0,7) || "ไม่ระบุ";
    out[month] = (out[month] || 0) + Number(b.total || 0);
  });
  return out;
}

function renderBarChart(data, max, isCount){
  const entries = Object.entries(data || {});
  if(entries.length === 0) return `<p class="muted">ยังไม่มีข้อมูล</p>`;
  return `<div style="display:grid;gap:12px">
    ${entries.map(([label,value])=>`
      <div>
        <div style="display:flex;justify-content:space-between;font-weight:800;margin-bottom:6px"><span>${label}</span><span>${isCount ? value : baht(value)}</span></div>
        <div style="height:14px;background:#ecfdf5;border-radius:999px;overflow:hidden">
          <div style="height:100%;width:${Math.max(4,Math.round((Number(value)/max)*100))}%;background:#065f46;border-radius:999px"></div>
        </div>
      </div>
    `).join("")}
  </div>`;
}

      </div>

function bookingsOnDate(dateKey){
  return (state.bookings || []).filter(b=>{
    if(!b.checkIn || !b.checkOut) return false;
    const start = new Date(b.checkIn);
    const end = new Date(b.checkOut);
    const d = new Date(dateKey);
    return d >= new Date(start.getFullYear(),start.getMonth(),start.getDate()) &&
           d < new Date(end.getFullYear(),end.getMonth(),end.getDate());
  });
}

function calendarStatusColor(status){
  if(status === "Confirmed") return "#DCFCE7";
  if(status === "Cancelled") return "#FEE2E2";
  if(status === "Check-in") return "#DBEAFE";
  if(status === "Check-out") return "#E5E7EB";
  return "#FEF3C7";
}

function exportBookingsCSV(){
  const headers = ["BK_ID","Customer","Phone","Room","RoomID","CheckIn","CheckOut","Total","Status","SlipURL"];
  const lines = [headers.join(",")].concat((state.bookings||[]).map(b=>[
    b.id,b.guest,b.phone,b.room,b.roomId,b.checkIn,b.checkOut,b.total,b.status,b.slipUrl || ""
  ].map(csvEscape).join(",")));
  downloadTextFile("booking-report.csv", lines.join("\n"), "text/csv;charset=utf-8");
}

function csvEscape(v){
  const s = String(v ?? "");
  return `"${s.replaceAll('"','""')}"`;
}

function exportBookingsJSON(){

function downloadTextFile(filename, content, type){
  const blob = new Blob([content], {type});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function handleManualSlipFile(input){

    manualBookingForm.slipBase64 = String(e.target.result || "").split(",")[1] || "";

  };
  reader.readAsDataURL(file);
}

async function submitManualBooking(){
  if(!can(["Owner","Admin","Staff"])) return alert(adminLabel("noPermission"));
  if(!manualBookingForm.guest || !manualBookingForm.phone){ alert("กรุณากรอกชื่อลูกค้าและเบอร์โทร"); return; }
  if(!manualBookingForm.roomId || !manualBookingForm.checkIn || !manualBookingForm.checkOut){ alert("กรุณาเลือกห้องและวันที่เข้าพัก"); return; }
  if(!validateBookingDateTime(manualBookingForm.checkIn, manualBookingForm.checkOut, manualBookingForm.checkInTime, manualBookingForm.checkOutTime)) return;
  if(!isApiReady()){ alert("ยังไม่ได้ตั้งค่า API_URL ของ Google Apps Script"); return; }
  const room = getManualBookingRoom();
  const paymentNote = `[Manual Booking][Payment: ${manualBookingForm.paymentStatus}]`;
  const booking = {
    guest:manualBookingForm.guest || "",
    phone:manualBookingForm.phone || "",
    email:manualBookingForm.email || "",
    lineId:manualBookingForm.lineId || "",
    lineUserId:manualBookingForm.lineUserId || "",
    roomId:room.id,
    roomType:room.type,
    room:room.name,
    checkIn:manualBookingForm.checkIn,
    checkOut:manualBookingForm.checkOut,
    checkInTime:policyCheckInTime(),
    checkOutTime:policyCheckOutTime(),
    adults:Number(manualBookingForm.adults || 1),
    children:Number(manualBookingForm.children || 0),
    addOns:manualBookingForm.addOns || [],
    total:getManualBookingTotal(),
    status:manualBookingForm.status || "Pending",
    slip:!!manualBookingForm.slipBase64,
    slipFileName:manualBookingForm.slipFileName || "",
    slipMimeType:manualBookingForm.slipMimeType || "image/jpeg",
    slipBase64:manualBookingForm.slipBase64 || "",
    channel:manualBookingForm.channel || "Phone",
    note:(paymentNote + " " + (manualBookingForm.note || "")).trim(),
    createdBy:adminUser ? adminUser.username : "admin"
  };
  const result = await api("createManualBooking", booking);
  if(!result || result.success === false){
    alert((result && result.message) || "บันทึกการจองไม่สำเร็จ");
    return;
  }
  const savedBooking = result.booking || (result.data && result.data.booking) || { ...booking, id: result.bookingId || ("BK"+Date.now().toString().slice(-8)) };
  state.bookings.unshift(savedBooking);
  saveState();
  log("Manual Booking", savedBooking.id + " · " + savedBooking.guest);
  manualBookingOpen = false;
  alert("บันทึกการจองสำเร็จ เลขที่: " + savedBooking.id);
  setAdminTab("bookings");
}

function isWeekendDate(dateStr){ const d = new Date(dateStr + "T00:00:00"); return [0,6].includes(d.getDay()); }
function dateInRange(dateStr,start,end){ if(!start || !end) return false; const d = new Date(dateStr + "T00:00:00"); return d >= new Date(start + "T00:00:00") && d <= new Date(end + "T00:00:00"); }
function isPublicHolidayDate(dateStr){
  return getPublicHolidays().some(h => h && h.active !== false && h.date === dateStr);
}
function isHighSeasonDate(dateStr){
  return getHighSeasonRanges().some(h => h && h.active !== false && dateInRange(dateStr, h.start, h.end));
}
function getPriceTypeForDate(dateStr){
  if(isHighSeasonDate(dateStr)) return "highSeason";
  if(isWeekendDate(dateStr) || isPublicHolidayDate(dateStr)) return "holiday";
  return "normal";
}
function getRoomPriceForDate(room,dateStr){
  const type = getPriceTypeForDate(dateStr);
  if(type === "highSeason") return Number(room.priceHighSeason || room.priceWeekend || room.price || 0);
  if(type === "holiday") return Number(room.priceWeekend || room.price || 0);
  return Number(room.priceWeekday || room.price || 0);
}
function calculateRoomTotal(room, checkIn, checkOut){
  const count = nights(checkIn, checkOut); let total = 0;
  const start = new Date(checkIn);
  for(let i=0;i<count;i++){ const d = new Date(start); d.setDate(start.getDate()+i); total += getRoomPriceForDate(room, d.toISOString().slice(0,10)); }
  return total;
}
function getDisplayStartPrice(room){ return Math.min(...[room.priceWeekday,room.priceWeekend,room.priceHighSeason,room.price].map(Number).filter(n=>n>0)); }

/* Override totals to use weekday/weekend/high-season price */
function getManualBookingTotal(){
  const room = getManualBookingRoom();
  const roomTotal = calculateRoomTotal(room, manualBookingForm.checkIn, manualBookingForm.checkOut);
  const addOnTotal = (manualBookingForm.addOns||[]).reduce((sum,id)=>{ const a=(state.addOns||[]).find(x=>x.id===id); return sum + Number(a?.price || 0); },0);
  return roomTotal + addOnTotal;
}

}

function updateRoomEditorField(k,v){ roomEditor[k]=v; if(['priceWeekday','priceWeekend','priceHighSeason'].includes(k)) roomEditor.price = Number(roomEditor.priceWeekday||roomEditor.price||0); }
function updateRoomEditorImages(v){ roomEditor.images = String(v||'').split('\n').map(x=>x.trim()).filter(Boolean); }
function uploadRoomEditorImages(){
  if(!roomEditor) return;
  openCloudinaryWidget((result)=>{
    if(!result.success){ alert(result.error || 'อัปโหลดรูปไม่สำเร็จ'); return; }
    if(!roomEditor.images) roomEditor.images = [];
    if(result.url && !roomEditor.images.includes(result.url)) roomEditor.images.push(result.url);
    render();
  }, { multiple:true, maxFiles:20 });
}
function removeRoomEditorImage(index){
  if(!roomEditor || !Array.isArray(roomEditor.images)) return;
  roomEditor.images.splice(index,1);
  render();
}
function setPrimaryRoomEditorImage(index){
  if(!roomEditor || !Array.isArray(roomEditor.images) || !roomEditor.images[index]) return;
  const selected = roomEditor.images.splice(index,1)[0];
  roomEditor.images.unshift(selected);
  render();
}

  const url = prompt('วาง URL รูปภาพ / Paste image URL');

  if(!roomEditor.images) roomEditor.images = [];
  roomEditor.images.push(url.trim());
  render();
}

async function saveRoomEditor(){
  if(!roomEditor.name || !roomEditor.type) return alert('กรุณากรอกชื่อห้องและประเภทห้อง');
  roomEditor.price = Number(roomEditor.priceWeekday || roomEditor.price || 0);
  ['capacity','maxCapacity','bedrooms','bathrooms','size','price','priceWeekday','priceWeekend','priceHighSeason','remaining'].forEach(k=>roomEditor[k]=Number(roomEditor[k]||0));
  const result = await api('saveRoom', roomEditor);
  if(result && result.success === false) return alert(result.message || 'บันทึกห้องไม่สำเร็จ');
  const i = (state.rooms||[]).findIndex(x=>x.id===roomEditor.id);
  if(i>=0) state.rooms[i]=structuredClone(roomEditor); else state.rooms.push(structuredClone(roomEditor));
  saveState(); roomEditorOpen=false; alert('บันทึกประเภทห้องสำเร็จ'); render();
}
async function deleteRoom(id){
  if(!can(["Owner","Admin"])) return alert(adminLabel('noPermission'));
  if(!confirm('ต้องการลบประเภทห้องนี้ใช่ไหม?')) return;
  const result = await api('deleteRoom',{id});
  if(result && result.success === false) return alert(result.message || 'ลบไม่สำเร็จ');
  state.rooms = (state.rooms||[]).filter(x=>x.id!==id); saveState(); render();
}

function sectionLabel(secOrId){
  const sec = typeof secOrId === 'object' ? secOrId : {id:secOrId,type:secOrId};
  const type = sec.type || sec.id;
  const fixed = {hero:'Hero / ส่วนหัว', rooms:'Rooms / ห้องพัก', gallery:'Gallery / รูปบรรยากาศ', details:'About / รายละเอียด', reviews:'Reviews / รีวิว', contact:'Contact / ติดต่อ'};
  if(type === 'custom') return `${sec.titleTh || 'Section ใหม่'} / ${sec.titleEn || 'Custom Section'}`;
  return fixed[type] || sec.id;
}
function layoutOptions(idOrType){ const id = idOrType; if(id==='rooms') return ['grid','list','magazine']; if(id==='gallery') return ['grid','carousel']; return ['default','cards','compact']; }
function toggleSection(id){ const s=getLayoutSections(); const x=s.find(a=>a.id===id); if(!x) return; x.enabled=!x.enabled; saveLayoutSections(s); render(); }
function moveSection(id,dir){ const s=getLayoutSections(); const i=s.findIndex(x=>x.id===id); const j=i+dir; if(j<0||j>=s.length) return; [s[i],s[j]]=[s[j],s[i]]; saveLayoutSections(s); render(); }
function changeSectionLayout(id,layout){ const s=getLayoutSections(); const x=s.find(a=>a.id===id); if(!x) return; x.layout=layout; saveLayoutSections(s); render(); }
function deleteLayoutSection(id){ const sec=getLayoutSections().find(x=>x.id===id); if(!sec) return; if(['hero','rooms'].includes(sec.type||sec.id)) return alert('Hero และ Rooms เป็น section หลัก ไม่แนะนำให้ลบ ให้ปิดการแสดงผลแทนได้'); if(!confirm('ลบ section นี้ใช่ไหม?')) return; saveLayoutSections(getLayoutSections().filter(x=>x.id!==id)); render(); }
function addLayoutSection(){
  const type = document.getElementById('addSectionType')?.value || 'custom';
  const list = getLayoutSections();
  if(type !== 'custom' && list.some(x=>(x.type||x.id)===type)) return alert('Section นี้มีอยู่แล้ว');

  list.push({ id, type, enabled:true, order:list.length+1, layout: layoutOptions(type)[0], titleTh:sectionDefaultTitle(type,'th'), titleEn:sectionDefaultTitle(type,'en'), contentTh:'', contentEn:'' });
  saveLayoutSections(list); render();
}
function updateSectionField(id,key,value){ const list=getLayoutSections(); const sec=list.find(x=>x.id===id); if(!sec) return; sec[key]=value; saveLayoutSections(list); }

/* Reports V2 */
function monthKey(v){ return String(v||'').slice(0,7) || 'ไม่ระบุ'; }
function getTaxRows(){ return (state.bookings||[]).filter(b=>b.status!=='Cancelled').map(b=>({ ...b, vat:Number(b.total||0)*7/107, beforeVat:Number(b.total||0)*100/107 })); }
function exportMonthlyRevenueCSV(){ const map={}; (state.bookings||[]).filter(b=>b.status!=='Cancelled').forEach(b=>{const m=monthKey(b.checkIn||b.createdAt); map[m]=map[m]||{month:m,count:0,total:0}; map[m].count++; map[m].total+=Number(b.total||0);}); const lines=['Month,Bookings,Revenue'].concat(Object.values(map).map(r=>[r.month,r.count,r.total].map(csvEscape).join(','))); downloadTextFile('monthly-revenue.csv',lines.join('\n'),'text/csv;charset=utf-8'); }
function exportGuestImmigrationCSV(){ const headers=['Guest','Nationality','Passport','CheckIn','CheckOut','Room','Phone']; const lines=[headers.join(',')].concat((state.bookings||[]).map(b=>[b.guest,b.nationality||'',b.passport||'',b.checkIn,b.checkOut,b.room,b.phone].map(csvEscape).join(','))); downloadTextFile('immigration-guest-list.csv',lines.join('\n'),'text/csv;charset=utf-8'); }
function exportTaxReportCSV(){ const lines=['Receipt,Booking,Guest,BeforeVAT,VAT7,Total,Date'].concat(getTaxRows().map((b,i)=>['RC'+String(i+1).padStart(5,'0'),b.id,b.guest,b.beforeVat.toFixed(2),b.vat.toFixed(2),Number(b.total||0).toFixed(2),b.createdAt||b.checkIn].map(csvEscape).join(','))); downloadTextFile('tax-report.csv',lines.join('\n'),'text/csv;charset=utf-8'); }
function printInvoicePDF(id){ const b=(state.bookings||[]).find(x=>x.id===id) || (state.bookings||[])[0]; if(!b) return alert('ไม่มีข้อมูล'); const vat=Number(b.total||0)*7/107, before=Number(b.total||0)*100/107; const html=`<html><head><meta charset="UTF-8"><title>Invoice ${b.id}</title><style>body{font-family:Arial,sans-serif;padding:40px;color:#111827}.box{max-width:800px;margin:auto;border:1px solid #ddd;border-radius:18px;padding:30px}h1{color:#065f46}.row{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:10px 0}table{width:100%;border-collapse:collapse;margin-top:20px}td,th{border:1px solid #ddd;padding:10px}</style></head><body><div class="box"><h1>ใบเสร็จ/ใบกำกับภาษี</h1><p><b>${state.settings.resortName||''}</b><br>${state.settings.address||''}</p><div class="row"><span>เลขที่เอกสาร</span><b>INV-${b.id}</b></div><div class="row"><span>ลูกค้า</span><b>${b.guest}</b></div><div class="row"><span>Booking</span><b>${b.id}</b></div><table><tr><th>รายการ</th><th>ยอด</th></tr><tr><td>${b.room} (${b.checkIn} - ${b.checkOut})</td><td>${baht(before)}</td></tr><tr><td>VAT 7%</td><td>${baht(vat)}</td></tr><tr><th>รวมสุทธิ</th><th>${baht(b.total)}</th></tr></table></div><script>window.print()<\/script></body></html>`; const w=window.open('','_blank'); w.document.write(html); w.document.close(); }
function runReportExport(){
  const type = document.getElementById('reportExportType')?.value || '';
  if(!type) return alert('กรุณาเลือกรายงานที่ต้องการ Export');
  if(type === 'booking') return exportBookingsCSV();
  if(type === 'monthly') return exportMonthlyRevenueCSV();
  if(type === 'immigration') return exportGuestImmigrationCSV();
  if(type === 'tax') return exportTaxReportCSV();
  if(type === 'invoice') return printInvoicePDF();
}

function renderReportsAdmin(){ const rows=state.bookings||[]; const active=rows.filter(b=>b.status!=='Cancelled'); const total=active.reduce((s,b)=>s+Number(b.total||0),0); const tax=getTaxRows().reduce((s,b)=>s+b.vat,0); return `<div class="grid grid-4"><div class="stat"><small>รายได้รวม</small><h3>${baht(total)}</h3></div><div class="stat"><small>Booking</small><h3>${rows.length}</h3></div><div class="stat"><small>VAT ประมาณการ</small><h3>${baht(tax)}</h3></div><div class="stat"><small>ลูกค้าไม่ซ้ำ</small><h3>${new Set(rows.map(b=>b.phone).filter(Boolean)).size}</h3></div></div><div class="card" style="padding:22px;margin-top:20px"><h2>Export Excel/CSV/PDF</h2><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><select id="reportExportType" class="secondary" style="min-width:320px;border:0;outline:0"><option value="">เลือกรายงานที่ต้องการ Export</option><option value="booking">Export Booking CSV</option><option value="monthly">รายงานรายได้รายเดือน</option><option value="immigration">รายชื่อแขกสำหรับ ตม.</option><option value="tax">รายงานภาษี CSV</option><option value="invoice">ใบเสร็จ/ใบกำกับภาษี PDF</option></select><button class="primary" onclick="runReportExport()">ดาวน์โหลด / Export</button><button class="secondary" onclick="syncAdminData()">รีเฟรช Google Sheet</button></div></div><div class="card" style="padding:22px;margin-top:20px;overflow:auto"><h2>Preview</h2><table><thead><tr><th>BK</th><th>ลูกค้า</th><th>ห้อง</th><th>วันที่</th><th>ยอด</th><th>ใบกำกับ</th></tr></thead><tbody>${rows.map(b=>`<tr><td>${b.id}</td><td>${b.guest}</td><td>${b.room}</td><td>${displayDateTimeRange(b)}</td><td>${baht(b.total)}</td><td><button class="secondary" onclick="printInvoicePDF('${b.id}')">PDF</button></td></tr>`).join('')||'<tr><td colspan="6">ยังไม่มีข้อมูล</td></tr>'}</tbody></table></div>`; }

initApp();
</script>
